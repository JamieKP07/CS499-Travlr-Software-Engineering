<div class="card">
  <div class="card-header">{{ trip.name }}</div>

  <img
    src="assets/images/{{ trip.image }}"
    alt="trip thumbnail"
    class="card-img-top">

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only
      {{ trip.perPerson | currency:'USD':'symbol' }}
      per person
    </p>

    <p class="card-text" [innerHTML]="trip.description"></p>

<button
  class="btn btn-info trip-action-button"
  (click)="editTrip(trip)"
  *ngIf="isLoggedIn()">
  Edit Trip
</button>

<button
  class="trip-action-button delete-button"
  (click)="deleteTrip(trip)"
  *ngIf="isLoggedIn()">
  Delete Trip
</button>

  </div>
</div>
